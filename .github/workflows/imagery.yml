name: fetch-imagery
on:
  push:
    branches: [osm-fetch]
    paths: ['imagery/request.txt']
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download imagery tiles
        run: |
          python3 - <<'PY'
          import math, urllib.request, os, time
          z, la0, lo0, la1, lo1 = open('imagery/request.txt').read().split()
          z = int(z); la0, lo0, la1, lo1 = map(float, (la0, lo0, la1, lo1))
          def t(lat, lon):
              n = 2 ** z; x = int((lon + 180) / 360 * n); y = int((1 - math.log(math.tan(math.radians(lat)) + 1 / math.cos(math.radians(lat))) / math.pi) / 2 * n); return x, y
          x0, y1 = t(la0, lo0); x1, y0 = t(la1, lo1)
          os.makedirs('tiles', exist_ok=True); n = 0
          for x in range(x0, x1 + 1):
              for y in range(y0, y1 + 1):
                  u = f'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}'
                  for k in range(3):
                      try:
                          d = urllib.request.urlopen(urllib.request.Request(u, headers={'User-Agent': 'mapa-vias-calgary/1.0'}), timeout=30).read(); break
                      except Exception as e: time.sleep(2)
                  else: continue
                  open(f'tiles/{z}_{x}_{y}.jpg', 'wb').write(d); n += 1
          print('tiles', n, x0, x1, y0, y1)
          PY
      - name: Stitch and commit
        run: |
          pip install pillow >/dev/null
          python3 - <<'PY'
          import glob, os
          from PIL import Image
          fs = glob.glob('tiles/*.jpg'); xs = sorted({int(f.split('_')[1]) for f in fs}); ys = sorted({int(f.split('_')[2][:-4]) for f in fs})
          z = os.path.basename(fs[0]).split('_')[0]
          im = Image.new('RGB', (256 * len(xs), 256 * len(ys)))
          for f in fs:
              x = int(f.split('_')[1]); y = int(f.split('_')[2][:-4]); im.paste(Image.open(f), (256 * (x - xs[0]), 256 * (y - ys[0])))
          im.save('imagery/mosaic.jpg', quality=88); open('imagery/mosaic.txt', 'w').write(f'{z} {xs[0]} {ys[0]} {len(xs)} {len(ys)}\n')
          PY
          git config user.name "github-actions"; git config user.email "actions@users.noreply.github.com"
          git add imagery/mosaic.jpg imagery/mosaic.txt; git commit -m "imagery" || true; git push
