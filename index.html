const u=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function op(pw){
  const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  const k=await crypto.subtle.deriveKey({name:'PBKDF2',salt:u(D.s),iterations:D.it,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:u(D.i)},k,u(D.c));
  return new TextDecoder().decode(pt);
}
async function go(pw,remember){
  const h=await op(pw);
  try{remember?localStorage.setItem('mv.pw',pw):localStorage.removeItem('mv.pw')}catch(e){}
  try{sessionStorage.setItem('mv.pw.s',pw)}catch(e){}
  document.open();document.write(h);document.close();
}
document.getElementById('f').onsubmit=async e=>{e.preventDefault();const m=document.getElementById('m');m.style.color='#8f9aa3';m.textContent='Opening…';
  try{await go(document.getElementById('p').value,document.getElementById('r').checked)}catch(err){m.style.color='#ff6b6b';m.textContent='Wrong password.'}};
(async()=>{let s=null;try{s=localStorage.getItem('mv.pw')}catch(e){} if(s){try{await go(s,true)}catch(e){try{localStorage.removeItem('mv.pw')}catch(_){}}}})();
